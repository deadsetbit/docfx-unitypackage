name: Verify base_url input

# Proves the base_url input reaches both places the action consumes a site URL: the sitemap
# in the generated docfx.json, and the meta refresh in the built index page.
#
# This repository has no Pages configuration. Without the input the action's URL lookup
# (`gh api repos/$GITHUB_REPOSITORY/pages`) fails and, because composite run steps stop on
# error, takes the step with it. So this workflow completing at all is itself the evidence
# that the input path was taken and the lookup never ran.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL the built site should carry'
        required: true
        default: 'https://example.invalid/verify-base-url/'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the action under test
        uses: actions/checkout@v4
        with:
          path: action-under-test

      - name: Write a minimal Unity package at the workspace root
        shell: bash
        run: |
          cat > package.json <<'JSON'
          {
            "name": "com.example.baseurlcheck",
            "version": "1.2.3",
            "displayName": "Base URL Check",
            "description": "Fixture package used to verify the base_url input.",
            "unity": "6000.0"
          }
          JSON
          printf '# Base URL Check\n\nFixture package.\n' > README.md
          printf '# Changelog\n\n## [1.2.3] - 2026-01-01\nFixture.\n' > CHANGELOG.md
          printf 'MIT\n' > LICENSE
          mkdir -p Runtime
          printf 'namespace Example { public class Thing { } }\n' > Runtime/Thing.cs

      - name: Build the site with base_url set
        uses: ./action-under-test
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_url: ${{ inputs.base_url }}

      - name: Assert the supplied URL reached the sitemap and the redirect
        shell: bash
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          url="$BASE_URL"
          case "$url" in */) ;; *) url="$url/" ;; esac

          echo "Expecting: $url"

          test -f _site/sitemap.xml || { echo "no sitemap was built"; exit 1; }
          grep -qF "$url" _site/sitemap.xml || {
            echo "sitemap does not carry the supplied URL:"; head -20 _site/sitemap.xml; exit 1;
          }

          grep -qF "content=\"0;URL=${url}manual/\"" _site/index.html || {
            echo "index redirect does not carry the supplied URL:"; grep -i refresh _site/index.html; exit 1;
          }

          echo "sitemap and index redirect both carry the supplied base URL."
