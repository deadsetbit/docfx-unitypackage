name: docfx-unitypackage
description: DocFX Unity package is a GitHub action for deploying a DocFX website for Unity packages to GitHub Pages.
author: Casey Hofland
branding:
  icon: 'file-text'
  color: 'white'
inputs:
  github_token:
    description: 'Set a generated GITHUB_TOKEN for pushing to the remote branch.'
    required: false
  base_url:
    description: >-
      Public base URL of the built site, with a trailing slash, e.g.
      https://owner.github.io/repo/. Set this when the site is deployed to a different
      repository than the one this workflow runs in, or when the running repository has no
      Pages configuration to read. Left empty, the URL is read from the running
      repository's Pages configuration, as before.
    required: false
    default: ''
  site_root_url:
    description: >-
      Root of the documentation site, with a trailing slash, e.g.
      https://owner.github.io/repo/. When the site publishes one folder per release,
      base_url points at this release's folder and this points at the root above it. The
      version manifest the superseded-version banner reads is resolved against it, and the
      resulting absolute URL is baked into every page. Left empty, no banner is baked.
    required: false
    default: ''
  home_url:
    description: >-
      Absolute URL baked into every page as a permanent link home. It is a link and never a
      fetch, so it keeps working from a page whose site has been retired. Left empty, no
      link is baked.
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    # This step needs to happen before anything else!
    - name: Move everything inside the manual/ folder.
      shell: bash
      run: |
        if [ -d Documentation~ ] && [ "$(ls -A Documentation~)" ]; then
          mv -v Documentation~/ manual/
          mkdir -p Documentation~
          mv -v manual/ Documentation~/manual/
        else
          mkdir -p Documentation~/manual
        fi

    # Generate pages, tables of contents, the docfx.json and anything the docfx needs.

    - name: Generate index page
      shell: bash
      run: echo 'This page redirects to the [manual](manual/).' > Documentation~/index.md

    - name: Generate main Table of Contents
      shell: bash
      run: |
        echo '- name: Manual
          href: manual/
          homepage: manual/index.md
        - name: Scripting API
          href: api/
          homepage: api/index.md' > Documentation~/toc.yml

    - name: Generate manual Table of Contents
      shell: bash
      # Replace * and 5 consecutive spaces with # in the Table of Contents to convert Unity's format to DocFX's format.
      run: |
        if [ -f Documentation~/manual/TableOfContents.md ]; then
          mv Documentation~/manual/TableOfContents.md Documentation~/manual/toc.md
        fi
        if [ -f Documentation~/manual/toc.md ]; then
          sed -i -e 's/*/#/g' Documentation~/manual/toc.md
          sed -i -e 's/     /#/g' Documentation~/manual/toc.md
        fi

    - name: Generate manual index page
      shell: bash
      run: |
        if [ ! -f Documentation~/manual/index.md ] && [ -f README.md ]; then
          cp README.md Documentation~/manual/index.md
        fi

    - name: Generate api index page
      shell: bash
      run: |
        mkdir -p Documentation~/api
        if [ -f Documentation~/api_index.md ]; then
          cp Documentation~/api_index.md Documentation~/api/index.md
          rm Documentation~/api_index.md
        else
          echo 'This is the documentation for the Scripting APIs of this package.' > Documentation~/api/index.md
        fi

    - name: Generate changelog page
      shell: bash
      run: |
        if [ -f CHANGELOG.md ]; then
          mkdir -p Documentation~/changelog
          cp CHANGELOG.md Documentation~/changelog/CHANGELOG.md
          echo '# [Changes](CHANGELOG.md)' > Documentation~/changelog/toc.md
          echo '- name: Changelog' >> Documentation~/toc.yml
          echo '  href: changelog/' >> Documentation~/toc.yml
          echo '  homepage: changelog/CHANGELOG.md' >> Documentation~/toc.yml
        fi

    - name: Generate license page
      shell: bash
      run: |
        if [ -f LICENSE ] && [ ! -f LICENSE.md ]; then
          mv -v LICENSE LICENSE.md
        fi
        if [ -f LICENSE.md ]; then
          mkdir -p Documentation~/license
          cp LICENSE.md Documentation~/license/LICENSE.md
          echo '# [License](LICENSE.md)' > Documentation~/license/toc.md
          if [ -f 'Third Party Notices.md' ]; then
            cp 'Third Party Notices.md' 'Documentation~/license/Third Party Notices.md'
            sed -i '1i# [Third Party Notices](Third Party Notices.md)' Documentation~/license/toc.md
          fi
          echo '- name: License' >> Documentation~/toc.yml
          echo '  href: license/' >> Documentation~/toc.yml
          echo '  homepage: license/LICENSE.md' >> Documentation~/toc.yml
        fi

    - name: Read package.json
      shell: bash
      run: |
        if [ -f package.json ]; then
          content=`cat package.json`
        else
          content='{}'
        fi
        echo 'package<<EOF' >> $GITHUB_ENV
        echo $content >> $GITHUB_ENV
        echo 'EOF' >> $GITHUB_ENV

    - name: Stage the site template
      shell: bash
      run: |
        rm -rf Documentation~/site-template
        cp -R '${{ github.action_path }}/site-template' Documentation~/site-template

    # Baked as static HTML rather than written by the banner script, because a reader with
    # scripting disabled still needs the version they are reading and a way home, and
    # because an immutable page cannot be given either of them afterwards.
    - name: Compose the page footer
      shell: bash
      env:
        SITE_ROOT_URL: ${{ inputs.site_root_url }}
        HOME_URL: ${{ inputs.home_url }}
      run: |
        set -euo pipefail

        # These reach an HTML attribute. Anything that could close one is refused rather
        # than escaped, so a malformed input fails the build instead of the page.
        for url in "$SITE_ROOT_URL" "$HOME_URL"; do
          [ -z "$url" ] && continue
          case "$url" in
            http://*|https://*) ;;
            *) echo "::error::'$url' is not an http(s) URL."; exit 1 ;;
          esac
          case "$url" in
            *[\"\<\>\&\ ]*) echo "::error::'$url' contains a character that cannot appear in an HTML attribute."; exit 1 ;;
          esac
        done

        version=''
        if [ -f package.json ]; then
          version=$(jq -r '.version // empty' package.json)
        fi

        footer="<span>Made by <a href=\"https://github.com/$GITHUB_REPOSITORY_OWNER\" target=\"_blank\">$GITHUB_REPOSITORY_OWNER</a> using <a href=\"https://dotnet.github.io/docfx\" target=\"_blank\">DocFX</a></span>"

        facts=''
        if [ -n "$version" ]; then
          manifest_attr=''
          if [ -n "$SITE_ROOT_URL" ]; then
            root="$SITE_ROOT_URL"
            case "$root" in */) ;; *) root="$root/" ;; esac
            manifest_attr=" data-docs-manifest=\"${root}versions.json\""
          fi
          facts="$facts<span class=\"docs-version\" data-docs-version=\"$version\"$manifest_attr>Version $version</span>"
        fi
        if [ -n "$HOME_URL" ]; then
          label="${HOME_URL#*://}"
          label="${label%/}"
          facts="$facts<span class=\"docs-home\"><a href=\"$HOME_URL\">$label</a></span>"
        fi
        if [ -n "$facts" ]; then
          footer="$footer<span class=\"docs-facts\">$facts</span>"
        fi

        # One line, JSON-quoted. Four later steps insert into the generated docfx.json by
        # line number, so the footer must not grow a second line.
        {
          echo 'app_footer_json<<APP_FOOTER_EOF'
          jq -Rn --arg html "$footer" '$html'
          echo 'APP_FOOTER_EOF'
        } >> "$GITHUB_ENV"

    - name: Generate docfx.json
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        BASE_URL: ${{ inputs.base_url }}
      run: |
        url="$BASE_URL"
        if [ -z "$url" ]; then
          url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url')
        fi
        case "$url" in */) ;; *) url="$url/" ;; esac
        echo '{
            "metadata": [{
                "src": [{"src": "..", "files": ["**/*.cs"]}],
                "dest": "api",
                "globalNamespaceId": "Global",
                "allowCompilationErrors": true
            }],
            "build": {
                "globalMetadata": {
                    "_appTitle": "'${{ fromJson(env.package).displayName }}' | '${{ fromJson(env.package).version }}'",
                    "_appFooter": '"$app_footer_json"',
                    "_enableSearch": true,
                    "_enableNewTab": false,
                    "_disableNewTab": true,
                    "_disableContribution": true,
                    "_disableNextArticle": true
                },
                "fileMetadata": {
                    "_disableContribution": {"manual/**/*.md": false}
                },
                "globalMetadataFiles": [
                ],
                "content": [
                    {"files": ["index.md", "toc.yml"]},
                    {"src": "license", "files": ["*.md"], "dest": "license"},
                    {"src": "changelog", "files": ["*.md"], "dest": "changelog"},
                    {"src": "api", "files": ["*.yml", "index.md"], "dest": "api"},
                    {"src": "manual", "files": ["**/*.md"], "dest": "manual"}
                ],
                "resource": [{"files": ["manual/images/*"]}],
                "template": ["default", "modern", "site-template"],
                "sitemap": {"baseUrl": "'$url'"},
                "xref": ["'$url'"],
                "xrefService": ["https://xref.docs.microsoft.com/query?uid={uid}"],
                "dest": "../_site"
            }
        }' > Documentation~/docfx.json

    - name: Set Global Metadata Files if exists
      shell: bash
      run: |
        if [ -f Documentation~/manual/config.json ] && [ -f Documentation~/manual/projectMetadata.json ]; then
          sed -i '22i\            "manual/config.json"' Documentation~/docfx.json
          sed -i '22i\            "manual/projectMetadata.json",' Documentation~/docfx.json
        elif [ -f Documentation~/manual/config.json ]; then
          sed -i '22i\            "manual/config.json"' Documentation~/docfx.json
        elif [ -f Documentation~/manual/projectMetadata.json ]; then
          sed -i '22i\            "manual/projectMetadata.json"' Documentation~/docfx.json
        fi

    - name: Disable toc if not exists
      shell: bash
      run: |
        if [ ! -f Documentation~/manual/toc.md ]; then
          sed -i '19i\            "_disableToc": {"manual/**/*.md": false},' Documentation~/docfx.json
          sed -i '19i\            "_layout": {"manual/**/*.md": "landing"},'  Documentation~/docfx.json
        fi
    
    - name: Set favicon if exists
      shell: bash
      run: |
        faviconPattern="Documentation~/manual/images/favicon.*"
        if compgen -G $faviconPattern > /dev/null; then
          favicons=( $faviconPattern )
          faviconPath=${favicons[0]}
          relativeFaviconPath=${faviconPath:15}
          sed -i '12i\            "_appFaviconPath": "'${relativeFaviconPath}'",' Documentation~/docfx.json
        fi

    - name: Set logo if exists
      shell: bash
      run: |
        logoPattern="Documentation~/manual/images/logo.*"
        if compgen -G $logoPattern > /dev/null; then
          logos=( $logoPattern )
          logoPath=${logos[0]}
          relativeLogoPath=${logoPath:15}
          sed -i '12i\            "_appLogoPath": "'${relativeLogoPath}'",' Documentation~/docfx.json
        fi

    - name: Set filter if exists
      shell: bash
      run: |
        if [ -f Documentation~/manual/filter.yml ]; then
          sed -i '5i\        "filter": "manual/filter.yml",' Documentation~/docfx.json
        elif [ -f Documentation~/manual/filter.yaml ]; then
          sed -i '5i\        "filter": "manual/filter.yaml",' Documentation~/docfx.json
        fi

    # The four steps above insert into docfx.json by line number. Nothing keeps those
    # numbers true as the generated JSON changes, so the one cheap way to notice is to
    # refuse to build a docfx.json that no longer parses.
    - name: Check the generated docfx.json still parses
      shell: bash
      run: |
        python3 -c 'import json,sys; json.load(open("Documentation~/docfx.json"))' || {
          echo "::error::the generated docfx.json is not valid JSON — a line-numbered insert landed wrong."
          cat -n Documentation~/docfx.json
          exit 1
        }

    # Build docfx site through the Documentation~ folder

    - name: Dotnet Setup
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 7.x
    
    - name: Dotnet Update
      shell: bash
      run: dotnet tool update -g docfx --version 2.76.0

    - name: Build
      shell: bash
      run: docfx Documentation~/docfx.json

    # Generate a redirect to the manual/ page, taking protocol and custom domain names into account.
    - name: Generate redirect
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        BASE_URL: ${{ inputs.base_url }}
      run: |
        url="$BASE_URL"
        if [ -z "$url" ]; then
          url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url')
        fi
        case "$url" in */) ;; *) url="$url/" ;; esac
        sed -i '/<\/head>/i\      <meta http-equiv="refresh" content="0;URL='"$url"manual/'">' _site/index.html
